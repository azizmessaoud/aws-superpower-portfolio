  context: Validation report §5.5 and README.
  limitations: []
  sources: [traffix-validation, traffix-readme]
  anchors: ["", ""]
  tags: [traffix, limitation, limitations, weakness, lanes, synthetic, retrain]
- id: fr-question
  projectId: flyrank
  claimIds: [FR-07]
  title: Which pages should a person review first
  text: >-
    The FlyRank capstone asks whether same-day performance and content signals can rank webpages for
    a more useful next-seven-day editorial review queue than a transparent age-plus-visibility rule.
    It is a prioritisation signal for human review, not a causal estimate of what a refresh does.
  context: FlyRank ML internship capstone (ML-11 research paper), pseudonymised internship warehouse.
  limitations:
    - Observational, not causal. It does not show that editing a page increases traffic.
  sources: [flyrank-capstone]
  anchors: ["#L1-L18"]
  tags: [flyrank, ranking, rank, prioritise, review, editor, editorial, queue, pages, seo, causal, traffic]
- id: fr-p50
  projectId: flyrank
  claimIds: [FR-02]
  title: Precision@50 of 0.94 against 0.76
  text: >-
    On 1,583 held-out pages from 8 clients the model never saw, a Random Forest put higher-traffic
    pages in its top 50 with Precision@50 of 0.94, against 0.76 for the fixed baseline. A hit is a page
    with at least 8 clicks in the following week, the 75th percentile of the training rows.
  context: Features from 31 March 2026; outcome = Google Search Console clicks 1–7 April 2026.
  limitations:
    - One decision date and one outcome week; observational, not causal.
    - The internship warehouse is gated, so the result cannot be fully reproduced in public.
  sources: [flyrank-w05, flyrank-capstone]
  anchors: ["", "#L55"]
  tags: [flyrank, precision, precision50, p50, metric, accuracy, result, model, random, forest, baseline, top]
- id: fr-method
  projectId: flyrank
  claimIds: [FR-06]
  title: Clients kept apart, baseline fixed first
  text: >-
    The baseline was fixed before the label was used. GroupShuffleSplit kept whole clients on one side:
    11,802 training rows from 21 clients and 1,583 test rows from 8 unseen clients, with no overlap.
    The model is a Random Forest with 150 trees, depth 14, minimum leaf 3 and seed 42.
  context: Capstone report, method section.
  limitations:
    - A grouped split tests transfer to new clients, not performance over time.
  sources: [flyrank-capstone]
  anchors: ["#L38-L42"]
  tags: [flyrank, method, split, groupshufflesplit, clients, holdout, evaluation, validation, random, forest]
- id: fr-leakage
  projectId: flyrank
  claimIds: [FR-08]
  title: A deliberate leakage test
  text: >-
    Leakage checks confirm that April data appears only in the label, every feature row is from
    31 March and no identifier is a predictor. A deliberately leaked label feature produced an
    inflated score and was removed before the honest run.
  context: Capstone report, method section.
  limitations:
    - The leaked feature was a planted test, not an accidental leak found in production.
  sources: [flyrank-capstone]
  anchors: ["#L44"]
  tags: [flyrank, leakage, leak, leaked, label, future, check, honest]
- id: fr-r2
  projectId: flyrank
  claimIds: [FR-05]
  title: Error on the count of clicks
  text: >-
    On the same held-out rows the Random Forest reached R² 0.50 and MAE 2.51 clicks, against R² 0.26
    for the calibrated baseline. A separate validation-audit rerun reports R² 0.52, kept apart.
  context: Capstone report, results table; held-out mean outcome 3.42 clicks.
  limitations:
    - A one-day snapshot misses later demand spikes; clicks are not revenue.
  sources: [flyrank-capstone]
  anchors: ["#L47-L61"]
  tags: [flyrank, r2, mae, error, regression, clicks, predict, prediction]
- id: hr-pipeline
  projectId: hr-docs
  claimIds: [HR-01]
  title: Every flag is explained, a person decides
  text: >-
    Uploaded PDFs and scans pass pre-flight checks, then Docling extraction with a RapidOCR fallback
    when confidence is low, schema and business validation, and cohort anomaly detection. Each flag
    carries a rule, severity, explanation and remediation, with sensitive values masked. The system
    never writes to an HR information system on its own.
  context: Local, self-hosted prototype; README architecture section.
  limitations:
    - Prototype tested on synthetic sample documents only.
  sources: [hr-readme]
  anchors: ["#L1-L16"]
  tags: [hr, document, documents, ocr, scanned, scan, pdf, anomaly, anomalies, docling, rapidocr, extraction, validation, hris, payroll, contract]
- id: hr-runtime
  projectId: hr-docs
  claimIds: [HR-05, HR-06]
  title: What actually runs today
  text: >-
    The current runtime is a synchronous FastAPI demo with in-memory jobs. Celery, Redis and PostgreSQL
    appear only in the planned full-stack mode. CSV and Excel files are outside the current OCR contract.
  context: README, runtime modes.
  limitations:
    - Planned services are not built.
  sources: [hr-readme]
  anchors: ["#L36-L40"]
  tags: [hr, fastapi, api, runtime, stack, tools, celery, redis, postgresql, csv, excel, production]
