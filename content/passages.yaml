  tags: [traffix, role, contribution, team, pair, control, sumo, safety, controllers, built, build, did, personally, ownership, owned]
- id: tr-pedestrian
  projectId: traffix
  claimIds: [TR-03]
  title: Fewer car greens while people cross
  text: >-
    With the trained models, about 18 car green phases per run started while pedestrians were
    crossing, against 331–405 with SUMO's actuated signals (−95%). The number is not zero.
  context: Tunis map, mean of seeds 1–3, three scenarios, models and network of 20 October 2026.
  limitations:
    - Three seeds and three scenarios; no difference is significant at p < 0.05.
    - Simulated with synthetic demand; not a safety result for real streets.
  sources: [traffix-validation]
  anchors: [""]
  tags: [traffix, pedestrian, crossing, safety, safe, green, conflict, walk]
- id: tr-ped-wait
  projectId: traffix
  claimIds: [TR-04]
  title: Pedestrian wait in the morning peak
  text: >-
    In the morning-peak scenario, mean pedestrian wait was 116.3 s with the trained models against
    144.1 s with actuated signals (−19%).
  context: One scenario, mean of 3 seeds, 20 October 2026 run.
  limitations:
    - One scenario and three seeds; not statistically significant.
  sources: [traffix-validation]
  anchors: [""]
  tags: [traffix, pedestrian, wait, waiting, morning, peak, time]
- id: tr-ambulance
  projectId: traffix
  challenges: [faster, quicker, improve, improved, better, speed]
  claimIds: [TR-05]
  title: Ambulances are slower, and that is not explained yet
  text: >-
    Emergency-vehicle trips were slower with TraffiX: 240.0 s against 213.2 s with actuated signals
    and 197.0 s with fixed-time signals. The objective was not met, and the cause is not yet known.
  context: Emergency scenario, mean of 3 seeds, 20 October 2026 run.
  limitations:
    - Possible causes named in the report (preparation horizon, extra car wait, routes) are untested.
  sources: [traffix-validation]
  anchors: [""]
  tags: [traffix, ambulance, emergency, vehicle, priority, faster, slower, trip]
- id: tr-mixed
  projectId: traffix
  claimIds: [TR-06]
  title: Mixed results, none significant
  text: >-
    Against actuated signals, mean car wait fell 11% in the morning peak and 24% in the incident
    scenario but rose 20% in the emergency scenario; pedestrian wait rose 11% in the incident scenario.
    None of the paired t-tests is significant at p < 0.05 with three seeds.
  context: Validation report §5.3–5.4.
  limitations:
    - Three seeds; synthetic demand; 18 of 21 junction roads use unverified lane counts.
  sources: [traffix-validation]
  anchors: [""]
  tags: [traffix, results, car, wait, significant, significance, statistics, test, better, improve]
- id: tr-limits
  projectId: traffix
  claimIds: [TR-09]
  title: Known limitations
  text: >-
    Demand is synthetic, 18 of 21 junction roads use unverified lane counts, it is a course project
