- id: tr-simulation
  projectId: traffix
  challenges: [deployed, deployment, production, live, street, streets]
  claimIds: [TR-01]
  title: A simulation, not a deployment
  text: >-
    TraffiX is a multi-agent traffic-control simulation of six signalised junctions (J1–J6) on the
    real OpenStreetMap streets of central Tunis, built on Eclipse SUMO and driven through TraCI. It is
    not deployed on any street: road demand is synthetic and nothing in the project is deployment evidence.
  context: ESPRIT 4DS course project, Intelligent Multi-Agent Traffic Management (team of six).
  limitations:
    - Simulation only. Road demand is synthetic; emissions are proxies, not measured air quality.
  sources: [traffix-readme]
  anchors: ["#L1-L11"]
  tags: [traffix, traffic, simulation, sumo, traci, tunis, junction, deployment, deployed, city, multi-agent]
- id: tr-control
  projectId: traffix
  claimIds: [TR-02]
  title: One writer per light, a reason for every decision
  text: >-
    Only one controller per traffic light may change it, a supermaster coordinates the junctions,
    and every decision is logged with a reason code. A language layer, Synapse, explains decisions
    from that log and never acts on the simulation.
  context: Architecture adopted by the team from aymenhamzik/traffix3.
  limitations:
    - The agent architecture was adopted from aymenhamzik/traffix3, not designed by me alone.
  sources: [traffix-readme, traffix-validation]
  anchors: ["#L6-L8", ""]
  tags: [traffix, controller, supermaster, reason, log, synapse, llm, explain, explanation, architecture, safety]
- id: tr-role
  projectId: traffix
  claimIds: [TR-08]
  title: My part of the team
  text: >-
    I worked in the Control pair with Fares Ben Kacem, covering SUMO, observations, the A1 agent,
    safety and the controllers. Pairs build, test and demo each work item, and roles rotate.
  context: Team of six ESPRIT 4DS students; README section 11.
  limitations:
