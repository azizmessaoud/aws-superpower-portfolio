- id: portfolio-weakest
  projectId: portfolio
  claimIds: [TR-05, HR-04, FR-02]
  title: The weakest measured results
  text: >-
    No project is ranked worst, because the three are measured in different ways. The weakest measured
    result is TraffiX in the emergency scenario: ambulance trips took 240.0 s against 213.2 s with actuated
    signals. The HR prototype has no accuracy figure at all, so nothing can be said about it either way.
    FlyRank beat its baseline on clients the model never saw (Precision@50 0.94 against 0.76), on one decision date.
  context: Restates the TraffiX validation report, the HR README and the FlyRank notebook output.
  limitations:
    - The three projects use different metrics and conditions, so the numbers are not comparable.
    - None of the TraffiX differences is significant at p < 0.05 with three seeds.
  sources: [traffix-validation, hr-readme, flyrank-w05]
  anchors: ["", "#L1-L16", ""]
  tags: [worst, weakest, bad, poor, performed, performance, lowest, results, project, projects, compare, compared, failed]

