# General definitions of terms visitors ask about. They are definitions of the TERM, not claims about me:
# the answer says so, and links to where the term appears in my work. `passage` must be a passage id.
- { term: "Precision@50", names: ["precision@50", "p@50", "precision at 50", "precision 50", "precision"], passage: fr-p50,
    definition: "Among the 50 items a model ranks highest, the share that turn out to be correct. It asks whether the top of a queue is worth a person's time." }
- { term: "Baseline", names: ["baseline", "base line", "benchmark"], passage: fr-method,
    definition: "A simple, readable rule fixed before looking at the answers, so a model has something honest to beat." }
- { term: "Holdout", names: ["holdout", "hold-out", "held out", "held-out", "grouped holdout", "test set", "unseen clients"], passage: fr-method,
    definition: "Data kept out of training and used only to test. A grouped holdout keeps whole groups (here, whole clients) apart, so the model cannot have seen anything from the groups it is tested on." }
- { term: "Data leakage", names: ["leakage", "data leakage", "leaked", "leak"], passage: fr-leakage,
    definition: "When information from the answer sneaks into the inputs, which inflates a score. A leakage test plants such a feature on purpose to check that the evaluation would catch it." }
- { term: "R²", names: ["r2", "r squared", "r-squared", "r²", "coefficient of determination"], passage: fr-r2,
    definition: "The share of the variation in an outcome that a model explains, compared with always predicting the average. 1 is perfect, 0 is no better than the average." }
- { term: "Seeds", names: ["seed", "seeds", "random seed", "random seeds"], passage: tr-mixed,
    definition: "The starting numbers of a random process. Running a simulation with several seeds shows how much a result changes by chance; three is few." }
- { term: "Statistical significance", names: ["significant", "significance", "p value", "p-value", "p < 0.05", "paired t-test", "t-test"], passage: tr-mixed,
    definition: "Whether a difference is larger than chance alone would plausibly produce. A p-value under 0.05 is the usual bar for calling a difference significant." }
- { term: "RAG", names: ["rag", "retrieval augmented generation", "retrieval-augmented generation", "retrieval augmented"], passage: pr-volunteering,
    definition: "Retrieval-augmented generation: a system first retrieves relevant documents, then a language model writes an answer from them. This site retrieves and shows the passages, without a language model." }
- { term: "OCR", names: ["ocr", "optical character recognition", "text recognition"], passage: hr-pipeline,
    definition: "Optical character recognition: turning an image or scan of text into machine-readable text." }
- { term: "SUMO", names: ["sumo", "eclipse sumo", "traffic simulator"], passage: tr-simulation,
    definition: "Simulation of Urban Mobility: an open-source traffic simulator that models vehicles, pedestrians and signals on a road network." }
- { term: "TraCI", names: ["traci", "traffic control interface"], passage: tr-simulation,
    definition: "Traffic Control Interface: the way a program reads and changes a running SUMO simulation." }
- { term: "Actuated and fixed-time signals", names: ["actuated", "actuated signals", "fixed-time", "fixed time", "fixed-time signals"], passage: tr-ambulance,
    definition: "Fixed-time signals follow a set schedule. Actuated signals extend or shorten phases when sensors see vehicles. Both are the standard baselines a new controller is compared with." }
- { term: "Synthetic demand", names: ["synthetic demand", "synthetic", "synthetic data"], passage: tr-limits,
    definition: "Traffic or data generated by rules instead of measured on real streets. Results on it show how a system behaves in a simulation, not in a city." }
- { term: "PFE", names: ["pfe", "projet de fin d'etudes", "final year project"], passage: pr-about,
    definition: "Projet de fin d'études: the final-year internship or project that completes an engineering degree in Tunisia and France." }
