# Security and caching headers for Amplify Hosting (prepared; applied only after deployment).
customHeaders:
  - pattern: "**/*"
    headers:
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
  - pattern: "/assets/**"
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: "/index.html"
    headers:
      - key: Cache-Control
        value: no-cache
